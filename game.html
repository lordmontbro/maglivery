<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maglivery - Visual Magnetic Track Builder</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; text-align: center; padding: 20px; }
    h1 { margin-bottom: 5px; color: #4deeea; }
    p { margin-bottom: 15px; font-size: 0.9rem; color: #aaa; }
    
    #game-container {
      display: inline-block;
      position: relative;
      background: #1e1e1e;
      border: 3px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas { display: block; background: #0a0a0a; cursor: pointer; }

    .controls {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      background: #2a2a2a;
      color: #fff;
      transition: 0.2s;
    }

    button:hover { background: #3a3a3a; }
    button.active { background: #4deeea; color: #000; border-color: #fff; }
    button#launch-btn { background: #74ee15; color: #000; }
    button#clear-btn { background: #ff0055; color: #fff; }
    
    #stats { margin-top: 12px; font-size: 1.2rem; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Maglivery Express</h1>
  <p>Select a track type, click to place on the grid, then hit R to rotate turns!</p>

  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="400"></canvas>
  </div>

  <div class="controls">
    <button id="tool-straight" class="active">Straight Track</button>
    <button id="tool-turn">Turn Track (Press R to Rotate)</button>
    <button id="tool-boost">Mag-Booster</button>
    <button id="launch-btn">🚀 Launch</button>
    <button id="clear-btn">Clear Board</button>
  </div>

  <div id="stats">Score: <span id="score">0</span></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 40;
    const COLS = canvas.width / GRID_SIZE;
    const ROWS = canvas.height / GRID_SIZE;

    // Load Track Images from images/gametracks/
    const images = {};
    const imageSources = {
      straight: 'images/gametracks/straight.png',
      turn: 'images/gametracks/turn.png',
      boost: 'images/gametracks/boost.png',
      dish: 'images/gametracks/dish.png'
    };

    let loadedImagesCount = 0;
    const totalImages = Object.keys(imageSources).length;

    for (let key in imageSources) {
      images[key] = new Image();
      images[key].src = imageSources[key];
      images[key].onload = () => {
        loadedImagesCount++;
      };
    }

    // Game state
    let selectedTool = 'straight';
    let currentRotation = 0; // 0, 90, 180, 270 degrees
    let tracks = {}; // Key: "x,y", Value: { type, rotation }
    let score = 0;

    // Delivery Nodes
    const kitchen = { x: 1, y: 5 };
    const customer = { x: 14, y: 5 };

    // Delivery Dish State
    let dish = {
      x: kitchen.x * GRID_SIZE + GRID_SIZE / 2,
      y: kitchen.y * GRID_SIZE + GRID_SIZE / 2,
      vx: 0,
      vy: 0,
      active: false,
      speed: 3
    };

    // UI Event Listeners
    document.getElementById('tool-straight').addEventListener('click', (e) => setTool('straight', e.target));
    document.getElementById('tool-turn').addEventListener('click', (e) => setTool('turn', e.target));
    document.getElementById('tool-boost').addEventListener('click', (e) => setTool('boost', e.target));
    document.getElementById('clear-btn').addEventListener('click', clearBoard);
    document.getElementById('launch-btn').addEventListener('click', launchDish);

    // Keyboard rotation shortcut
    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        currentRotation = (currentRotation + 90) % 360;
      }
    });

    function setTool(tool, element) {
      selectedTool = tool;
      document.querySelectorAll('.controls button').forEach(b => {
        if (b.id.startsWith('tool-')) b.classList.remove('active');
      });
      element.classList.add('active');
    }

    // Grid placement
    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const gridX = Math.floor((e.clientX - rect.left) / GRID_SIZE);
      const gridY = Math.floor((e.clientY - rect.top) / GRID_SIZE);

      if ((gridX === kitchen.x && gridY === kitchen.y) || 
          (gridX === customer.x && gridY === customer.y)) return;

      const key = `${gridX},${gridY}`;
      if (tracks[key] && tracks[key].type === selectedTool && tracks[key].rotation === currentRotation) {
        delete tracks[key];
      } else {
        tracks[key] = { type: selectedTool, rotation: currentRotation, x: gridX, y: gridY };
      }
    });

    function clearBoard() {
      tracks = {};
      resetDish();
    }

    function launchDish() {
      if (dish.active) return;
      resetDish();
      dish.active = true;
      dish.vx = dish.speed;
    }

    function resetDish() {
      dish.x = kitchen.x * GRID_SIZE + GRID_SIZE / 2;
      dish.y = kitchen.y * GRID_SIZE + GRID_SIZE / 2;
      dish.vx = 0;
      dish.vy = 0;
      dish.active = false;
      dish.speed = 3;
    }

    function update() {
      if (!dish.active) return;

      dish.x += dish.vx;
      dish.y += dish.vy;

      const currentGridX = Math.floor(dish.x / GRID_SIZE);
      const currentGridY = Math.floor(dish.y / GRID_SIZE);
      const key = `${currentGridX},${currentGridY}`;

      if (tracks[key]) {
        const track = tracks[key];
        if (track.type === 'boost') {
          if (dish.vx > 0) dish.vx = 7;
          if (dish.vx < 0) dish.vx = -7;
          if (dish.vy > 0) dish.vy = 7;
          if (dish.vy < 0) dish.vy = -7;
        }
      }

      // Customer Arrival Check
      const distToCustomer = Math.hypot(
        dish.x - (customer.x * GRID_SIZE + GRID_SIZE / 2),
        dish.y - (customer.y * GRID_SIZE + GRID_SIZE / 2)
      );

      if (distToCustomer < 16) {
        score += 100;
        document.getElementById('score').innerText = score;
        resetDish();
        alert('🍲 Delivery Delivered Successfully!');
      }

      // Out of bounds reset
      if (dish.x < 0 || dish.x > canvas.width || dish.y < 0 || dish.y > canvas.height) {
        resetDish();
      }
    }

    function drawRotatedTile(img, x, y, angleDeg) {
      const centerX = x * GRID_SIZE + GRID_SIZE / 2;
      const centerY = y * GRID_SIZE + GRID_SIZE / 2;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate((angleDeg * Math.PI) / 180);
      ctx.drawImage(img, -GRID_SIZE / 2, -GRID_SIZE / 2, GRID_SIZE, GRID_SIZE);
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Grid Lines
      ctx.strokeStyle = '#1e1e1e';
      for (let i = 0; i < canvas.width; i += GRID_SIZE) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }
      for (let j = 0; j < canvas.height; j += GRID_SIZE) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
      }

      // Render Tracks using images
      for (let key in tracks) {
        const t = tracks[key];
        const img = images[t.type];
        if (img && img.complete) {
          drawRotatedTile(img, t.x, t.y, t.rotation);
        }
      }

      // Render Kitchen
      ctx.fillStyle = '#ff0055';
      ctx.fillRect(kitchen.x * GRID_SIZE, kitchen.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
      ctx.fillStyle = '#fff';
      ctx.font = '12px sans-serif';
      ctx.fillText('Kitchen', kitchen.x * GRID_SIZE + 2, kitchen.y * GRID_SIZE + 24);

      // Render Customer Target
      ctx.fillStyle = '#74ee15';
      ctx.fillRect(customer.x * GRID_SIZE, customer.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
      ctx.fillStyle = '#000';
      ctx.fillText('Target', customer.x * GRID_SIZE + 3, customer.y * GRID_SIZE + 24);

      // Render Dish
      if (dish.active) {
        if (images.dish && images.dish.complete) {
          ctx.drawImage(
            images.dish, 
            dish.x - GRID_SIZE / 2, 
            dish.y - GRID_SIZE / 2, 
            GRID_SIZE, 
            GRID_SIZE
          );
        } else {
          // Fallback if dish image fails to load
          ctx.beginPath();
          ctx.arc(dish.x, dish.y, 10, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        }
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
