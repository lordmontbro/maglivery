<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maglivery Express</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #121212; color: #fff; text-align: center; padding: 20px; }
    h1 { margin-bottom: 5px; color: #4deeea; }
    p { margin-bottom: 15px; font-size: 0.9rem; color: #aaa; }
    
    #game-container {
      display: inline-block;
      position: relative;
      background: #1e1e1e;
      border: 3px solid #333;
      border-radius: 8px;
      overflow: hidden;
    }

    canvas { display: block; background: #0a0a0a; cursor: pointer; }

    .controls {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 16px;
      font-size: 0.9rem;
      font-weight: bold;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      background: #2a2a2a;
      color: #fff;
      transition: 0.2s;
    }

    button:hover { background: #3a3a3a; }
    button.active { background: #4deeea; color: #000; border-color: #fff; }
    button#launch-btn { background: #74ee15; color: #000; }
    button#clear-btn { background: #ff0055; color: #fff; }
    
    #stats { margin-top: 12px; font-size: 1.2rem; font-weight: bold; }
    .info { margin-top: 5px; color: #4deeea; font-weight: bold; }
  </style>
</head>
<body>

  <h1>Maglivery Express</h1>
  <p>Select a track type, click to place on the grid, and press <b>R</b> to rotate selected track orientation!</p>
  <div class="info">Current Rotation: <span id="rot-display">0°</span></div>

  <div id="game-container">
    <canvas id="gameCanvas" width="640" height="400"></canvas>
  </div>

  <div class="controls">
    <button id="tool-straight" class="active">Straight Track</button>
    <button id="tool-turn">Turn Track</button>
    <button id="tool-boost">Mag-Booster</button>
    <button id="launch-btn">🚀 Launch</button>
    <button id="clear-btn">Clear Board</button>
  </div>

  <div id="stats">Score: <span id="score">0</span></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 40;
    
    const imageSources = {
      straight: 'https://lordmontbro.github.io/maglivery/images/gamestacks/straight.png',
      turn: 'https://lordmontbro.github.io/maglivery/images/gamestacks/90turn.png',
      boost: 'https://lordmontbro.github.io/maglivery/images/gamestacks/boost.png',
      dish: 'https://lordmontbro.github.io/maglivery/images/gamestacks/dish.png'
    };

    const images = {};
    const loadedStatus = {};

    for (let key in imageSources) {
      images[key] = new Image();
      images[key].crossOrigin = 'anonymous';
      images[key].src = imageSources[key];
      loadedStatus[key] = false;
      images[key].onload = () => { loadedStatus[key] = true; };
      images[key].onerror = () => { loadedStatus[key] = false; };
    }

    let selectedTool = 'straight';
    let currentRotation = 0; // 0, 90, 180, 270
    let tracks = {};
    let score = 0;

    const kitchen = { x: 1, y: 5 };
    const customer = { x: 14, y: 5 };

    // Movement Directions: 0=Right, 1=Down, 2=Left, 3=Up
    const DX = [1, 0, -1, 0];
    const DY = [0, 1, 0, -1];

    let dish = {
      x: kitchen.x * GRID_SIZE + GRID_SIZE / 2,
      y: kitchen.y * GRID_SIZE + GRID_SIZE / 2,
      dir: 0, // Starts moving Right
      active: false,
      speed: 2,
      lastGridX: -1,
      lastGridY: -1
    };

    document.getElementById('tool-straight').addEventListener('click', (e) => setTool('straight', e.target));
    document.getElementById('tool-turn').addEventListener('click', (e) => setTool('turn', e.target));
    document.getElementById('tool-boost').addEventListener('click', (e) => setTool('boost', e.target));
    document.getElementById('clear-btn').addEventListener('click', clearBoard);
    document.getElementById('launch-btn').addEventListener('click', launchDish);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        currentRotation = (currentRotation + 90) % 360;
        document.getElementById('rot-display').innerText = currentRotation + '°';
      }
    });

    function setTool(tool, element) {
      selectedTool = tool;
      document.querySelectorAll('.controls button').forEach(b => {
        if (b.id.startsWith('tool-')) b.classList.remove('active');
      });
      element.classList.add('active');
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const gridX = Math.floor((e.clientX - rect.left) / GRID_SIZE);
      const gridY = Math.floor((e.clientY - rect.top) / GRID_SIZE);

      if ((gridX === kitchen.x && gridY === kitchen.y) || 
          (gridX === customer.x && gridY === customer.y)) return;

      const key = `${gridX},${gridY}`;
      if (tracks[key] && tracks[key].type === selectedTool && tracks[key].rotation === currentRotation) {
        delete tracks[key];
      } else {
        tracks[key] = { type: selectedTool, rotation: currentRotation, x: gridX, y: gridY };
      }
    });

    function clearBoard() { tracks = {}; resetDish(); }

    function launchDish() {
      if (dish.active) return;
      resetDish();
      dish.active = true;
      dish.dir = 0; // Move right initially
    }

    function resetDish() {
      dish.x = kitchen.x * GRID_SIZE + GRID_SIZE / 2;
      dish.y = kitchen.y * GRID_SIZE + GRID_SIZE / 2;
      dish.dir = 0;
      dish.active = false;
      dish.speed = 2;
      dish.lastGridX = -1;
      dish.lastGridY = -1;
    }

    function update() {
      if (!dish.active) return;

      // Move dish based on current direction
      dish.x += DX[dish.dir] * dish.speed;
      dish.y += DY[dish.dir] * dish.speed;

      const gridX = Math.floor(dish.x / GRID_SIZE);
      const gridY = Math.floor(dish.y / GRID_SIZE);
      const cellCenterX = gridX * GRID_SIZE + GRID_SIZE / 2;
      const cellCenterY = gridY * GRID_SIZE + GRID_SIZE / 2;

      // Check turning at cell centers
      const distToCenter = Math.hypot(dish.x - cellCenterX, dish.y - cellCenterY);

      if (distToCenter < dish.speed && (gridX !== dish.lastGridX || gridY !== dish.lastGridY)) {
        const key = `${gridX},${gridY}`;
        const track = tracks[key];

        if (track) {
          // Center the dish precisely
          dish.x = cellCenterX;
          dish.y = cellCenterY;
          dish.lastGridX = gridX;
          dish.lastGridY = gridY;

          if (track.type === 'boost') {
            dish.speed = 4;
          }

          if (track.type === 'turn') {
            // Path logic based on 90-degree curve rotation
            const rot = track.rotation;
            if (rot === 0) {
              if (dish.dir === 0) dish.dir = 1;      // Right -> Down
              else if (dish.dir === 3) dish.dir = 2; // Up -> Left
              else dish.active = false;              // Derail
            } else if (rot === 90) {
              if (dish.dir === 1) dish.dir = 2;      // Down -> Left
              else if (dish.dir === 0) dish.dir = 3; // Right -> Up
              else dish.active = false;
            } else if (rot === 180) {
              if (dish.dir === 2) dish.dir = 3;      // Left -> Up
              else if (dish.dir === 1) dish.dir = 0; // Down -> Right
              else dish.active = false;
            } else if (rot === 270) {
              if (dish.dir === 3) dish.dir = 0;      // Up -> Right
              else if (dish.dir === 2) dish.dir = 1; // Left -> Down
              else dish.active = false;
            }
          } else if (track.type === 'straight') {
            // Check alignment: 0 & 180 deg = Horizontal, 90 & 270 deg = Vertical
            const isHorizontalTrack = (track.rotation === 0 || track.rotation === 180);
            const isMovingHorizontal = (dish.dir === 0 || dish.dir === 2);

            if (isHorizontalTrack !== isMovingHorizontal) {
              dish.active = false; // Derail if direction mismatch
            }
          }
        }
      }

      // Customer Target Check
      const distToCustomer = Math.hypot(
        dish.x - (customer.x * GRID_SIZE + GRID_SIZE / 2),
        dish.y - (customer.y * GRID_SIZE + GRID_SIZE / 2)
      );

      if (distToCustomer < 12) {
        score += 100;
        document.getElementById('score').innerText = score;
        resetDish();
        alert('🍲 Delivery Successful!');
      }

      // Out of bounds reset
      if (dish.x < 0 || dish.x > canvas.width || dish.y < 0 || dish.y > canvas.height) {
        resetDish();
      }
    }

    function drawTile(t) {
      const centerX = t.x * GRID_SIZE + GRID_SIZE / 2;
      const centerY = t.y * GRID_SIZE + GRID_SIZE / 2;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate((t.rotation * Math.PI) / 180);

      if (loadedStatus[t.type]) {
        ctx.drawImage(images[t.type], -GRID_SIZE / 2, -GRID_SIZE / 2, GRID_SIZE, GRID_SIZE);
      } else {
        // Fallback placeholder rendering with center track lines
        ctx.fillStyle = t.type === 'boost' ? '#ffe600' : '#4deeea';
        ctx.fillRect(-GRID_SIZE / 2 + 2, -GRID_SIZE / 2 + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 4;
        ctx.beginPath();
        if (t.type === 'straight' || t.type === 'boost') {
          // Horizontal guide line relative to tile angle
          ctx.moveTo(-GRID_SIZE / 2, 0);
          ctx.lineTo(GRID_SIZE / 2, 0);
        } else if (t.type === 'turn') {
          // Curved guide line
          ctx.arc(-GRID_SIZE / 2, -GRID_SIZE / 2, GRID_SIZE / 2, 0, Math.PI / 2);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Render Grid Lines
      ctx.strokeStyle = '#1e1e1e';
      for (let i = 0; i < canvas.width; i += GRID_SIZE) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
      }
      for (let j = 0; j < canvas.height; j += GRID_SIZE) {
        ctx.beginPath(); ctx.moveTo(0, j); ctx.lineTo(canvas.width, j); ctx.stroke();
      }

      // Render Placed Track Tiles
      for (let key in tracks) {
        drawTile(tracks[key]);
      }

      // Render Start & End Zones
      ctx.fillStyle = '#ff0055';
      ctx.fillRect(kitchen.x * GRID_SIZE, kitchen.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);
      ctx.fillStyle = '#74ee15';
      ctx.fillRect(customer.x * GRID_SIZE, customer.y * GRID_SIZE, GRID_SIZE, GRID_SIZE);

      // Render Dish Object
      if (dish.active) {
        if (loadedStatus.dish) {
          ctx.drawImage(images.dish, dish.x - 15, dish.y - 15, 30, 30);
        } else {
          ctx.beginPath();
          ctx.arc(dish.x, dish.y, 10, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
        }
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
